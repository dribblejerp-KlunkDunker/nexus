name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    name: Verification gate
    # windows-latest on purpose: NEXUS ships for Windows, and the firewall
    # self-test exercises the netsh argv path, which only exists there.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # fastapi/httpx/uvicorn: the dashboard import + endpoint smoke tests
          # exercise the real API surface in CI (dashboard imports uvicorn and
          # scapy at module level). Everything heavier (neat, torch, onnx)
          # stays out: the code degrades to HEURISTIC_ONLY, which the tests
          # pin as the honest floor.
          python -m pip install pytest numpy fastapi httpx uvicorn scapy

      - name: Install web build tooling
        run: npm install --no-audit --no-fund

      - name: Verification gate (pytest, compile, self-tests, web freshness, offline audit)
        run: python tools/check.py

      - name: Performance doc freshness
        run: python tools/gen_performance_doc.py --check
